name: Build Business

on:
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Write key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ ! -z "$KEY_STORE" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo "$KEY_STORE" | base64 --decode > key.jks
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch fonts
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts
          base="https://raw.githubusercontent.com/google/fonts/main/ofl"
          dl() { curl -fsSL "$base/$1" -o "app/src/main/assets/fonts/$2" || rm -f "app/src/main/assets/fonts/$2"; }
          dl 'nunito/Nunito%5Bwght%5D.ttf' Nunito.ttf
          dl 'quicksand/Quicksand%5Bwght%5D.ttf' Quicksand.ttf
          dl 'fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf' Fredoka.ttf

      - name: Build Business Release
        run: ./gradlew assembleBusinessRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsPosed-Business
          path: app/build/outputs/apk/business/release/WhatsPosed-Business*.apk

      - name: Upload Proguard mapping
        uses: actions/upload-artifact@v4
        with:
          name: WhatsPosed-Business-mapping
          path: app/build/outputs/mapping/businessRelease/mapping.txt
